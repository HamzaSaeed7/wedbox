name: Deploy to Cloudways

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Sync files to server via rsync
        env:
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: /home/1636408.cloudwaysapps.com/zmkyvwckpm/public_html
        run: |
          sudo apt-get install -y sshpass rsync
          rsync -az --delete \
            -e "sshpass -p \"$SSH_PASS\" ssh -p \"$SSH_PORT\" -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: 300s
          script: |
            set -e
            export PHP=/usr/bin/php8.3
            cd /home/1636408.cloudwaysapps.com/zmkyvwckpm/public_html

            echo "==> Ensuring storage directory structure exists..."
            mkdir -p storage/framework/{cache/data,sessions,views,testing}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            echo "==> Installing PHP dependencies..."
            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Running migrations..."
            $PHP artisan migrate --force

            echo "==> Clearing & caching config..."
            $PHP artisan optimize:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            echo "==> Fixing storage permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "==> Creating storage symlink..."
            $PHP artisan storage:link || true

            echo "==> Restarting queue worker..."
            $PHP artisan queue:restart || true

            echo "==> Deployment complete!"
